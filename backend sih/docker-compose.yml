version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://sih:sih@postgres:5432/sih
      - REDIS_URL=redis://redis:6379/0
      - MODEL_SERVICE_URL=http://ml-service:8100
      - DEMO_MODE=false
    depends_on:
      - postgres
      - redis
      - ml-service

  postgres:
    image: postgis/postgis:15-3.3
    container_name: sih-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sih
      - POSTGRES_USER=sih
      - POSTGRES_PASSWORD=sih
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sih-redis
    ports:
      - "6379:6379"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://sih:sih@postgres:5432/sih
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: sih-ml-service
    ports:
      - "8100:8100"

volumes:
  postgres_data:
